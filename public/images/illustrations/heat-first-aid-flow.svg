<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Cooling first aid flowchart</title><desc id="desc">Flowchart for moving an overheated pet to shade, applying cool water, using airflow, and calling a veterinarian.</desc>
<rect width="1000" height="620" fill="#f4fbff"/>
<text x="70" y="62" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#183b56">Overheated pet: first-aid flow</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2f6f8f"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="95" y="120" width="260" height="92" rx="18" fill="#ffe7b3" stroke="#d28729" stroke-width="5"/><text x="225" y="155" font-size="22" font-weight="700">1. Stop activity</text><text x="225" y="186" font-size="18">Carry or leash to shade</text>
<line x1="355" y1="166" x2="440" y2="166" stroke="#2f6f8f" stroke-width="7" marker-end="url(#arrow)"/>
<rect x="450" y="120" width="260" height="92" rx="18" fill="#d6f1ff" stroke="#2f8db8" stroke-width="5"/><text x="580" y="155" font-size="22" font-weight="700">2. Wet with cool water</text><text x="580" y="186" font-size="18">Neck, belly, paws, groin</text>
<line x1="580" y1="212" x2="580" y2="280" stroke="#2f6f8f" stroke-width="7" marker-end="url(#arrow)"/>
<rect x="450" y="290" width="260" height="92" rx="18" fill="#dff7df" stroke="#4d9a57" stroke-width="5"/><text x="580" y="325" font-size="22" font-weight="700">3. Add airflow</text><text x="580" y="356" font-size="18">Fan or moving car A/C</text>
<line x1="450" y1="336" x2="365" y2="336" stroke="#2f6f8f" stroke-width="7" marker-end="url(#arrow)"/>
<rect x="95" y="290" width="260" height="92" rx="18" fill="#ffd6d6" stroke="#d65050" stroke-width="5"/><text x="225" y="325" font-size="22" font-weight="700">4. Call a vet</text><text x="225" y="356" font-size="18">Emergency signs = go now</text>
<line x1="225" y1="382" x2="225" y2="450" stroke="#2f6f8f" stroke-width="7" marker-end="url(#arrow)"/>
<rect x="95" y="460" width="615" height="82" rx="18" fill="#ffffff" stroke="#7f8c8d" stroke-width="5"/><text x="402" y="494" font-size="22" font-weight="700">Stop active cooling when improving and no longer hot to touch</text><text x="402" y="525" font-size="18">Do not use ice baths; avoid forcing water into the mouth.</text>
</g>
<path d="M810 170 c70 30 70 120 0 150 M828 210 c36 22 36 58 0 82" fill="none" stroke="#80b9d3" stroke-width="12" stroke-linecap="round"/>
</svg>