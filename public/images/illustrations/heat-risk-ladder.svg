<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Heat risk ladder for pets</title><desc id="desc">A color coded ladder showing increasing pet heat risk from warm day to emergency signs.</desc>
<rect width="1000" height="620" fill="#fffaf0"/>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#263238">Pet heat-risk ladder</text>
<text x="60" y="112" font-family="Arial, sans-serif" font-size="22" fill="#52616b">Move down the ladder early: shade, water, rest, then veterinary help for red flags.</text>
<g font-family="Arial, sans-serif" font-size="23" fill="#263238">
<rect x="90" y="450" width="780" height="72" rx="18" fill="#9bd5a6"/><text x="125" y="495">Level 1: Warm walk — shorten route, carry water, seek shade</text>
<rect x="90" y="360" width="780" height="72" rx="18" fill="#f5d978"/><text x="125" y="405">Level 2: Panting + slowing — stop exercise, cool indoor rest</text>
<rect x="90" y="270" width="780" height="72" rx="18" fill="#f4a460"/><text x="125" y="315">Level 3: Heavy panting, drool, weakness — active cooling, call vet</text>
<rect x="90" y="180" width="780" height="72" rx="18" fill="#e76f51"/><text x="125" y="225" fill="#fff">Level 4: Collapse, vomiting, seizures — emergency clinic now</text>
</g>
<path d="M908 518 V188" stroke="#263238" stroke-width="8" stroke-linecap="round"/><path d="M908 188 l-24 34 M908 188 l24 34" stroke="#263238" stroke-width="8" stroke-linecap="round"/>
<text x="870" y="560" font-family="Arial, sans-serif" font-size="20" fill="#52616b" transform="rotate(-90 870 560)">RISK RISES FAST</text>
</svg>